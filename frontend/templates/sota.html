<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>COMP263 Deep Learning - Group 4</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}"/>
    </head>
    <body>
        <header>
            <h1>State of the Art Model</h1>
            <nav>
                <ul>
                    <li><a href="{{ url_for('homepage') }}">Homepage</a></li>
                    <li><a href="{{ url_for('supervisedModel') }}">Supervised Model</a></li>
                    <li><a href="{{ url_for('unsupervisedModel') }}">Unsupervised Model</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="image-section">
                <h1>MobileNetV2 Transfer Learning Model Predictions</h1>
                <div class="image-row">
                    <div>
                        <h3>Test Image</h3>
                        <img id="sotaImage" src="" alt="Test image" width="300" />
                        <p><strong>Actual Label:</strong> <span id="actualLabel">-</span> 
                           (<span id="actualLabelText">-</span>)</p>
                        <p><strong>Predicted Label:</strong> <span id="predictedLabel">-</span>
                           (<span id="predictedLabelText">-</span>)</p>
                        <p id="accuracy"></p>
                    </div>
                </div>
                <button onclick="evaluateSotaModel()">Evaluate Model</button>
            </div>

            <script>
                function getLabelText(label) {
                    return label === 1 ? "Malignant" : "Benign";
                }

                function evaluateSotaModel() {
                    fetch('/state-of-the-art-predictions')
                        .then(response => response.json())
                        .then(data => {
                            // Update image
                            document.getElementById('sotaImage').src = 'data:image/png;base64,' + data.image;
                            
                            // Update labels
                            document.getElementById('actualLabel').innerText = data.actual_label;
                            document.getElementById('actualLabelText').innerText = getLabelText(data.actual_label);
                            
                            document.getElementById('predictedLabel').innerText = data.predicted_label;
                            document.getElementById('predictedLabelText').innerText = getLabelText(data.predicted_label);
                            
                            // Show accuracy
                            const isCorrect = data.actual_label === data.predicted_label;
                            document.getElementById('accuracy').innerHTML = 
                                `<strong>Prediction ${isCorrect ? 'Correct' : 'Incorrect'}</strong>`;
                            document.getElementById('accuracy').style.color = 
                                isCorrect ? 'green' : 'red';
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('Error fetching prediction. Please try again.');
                        });
                }
            </script>
        </main>

        <footer>
            <p>&copy; 2025 COMP263 - Group 4. All Rights Reserved.</p>
        </footer>
    </body>
</html>
